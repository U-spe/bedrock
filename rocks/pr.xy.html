<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090909">
  <meta name="color-scheme" content="dark">

  <title>rockz | bedrock</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/menu.css">
  <link rel="stylesheet" href="/rocks/rockz.css">

  <script src="/js/themes.js" defer></script>
  <script src="/js/globalmenu.js" defer></script>
  <script src="/rocks/request.js" defer></script>
  <script src="/rocks/rockz.js" defer></script>
</head>

<body data-bg-style="stars">
  <div id="bg-effects-container" aria-hidden="true">
    <canvas id="stars-canvas"></canvas>
    <div id="fog-overlay"></div>
  </div>

  <div class="background-grid" aria-hidden="true"></div>
  <div class="background-glow" aria-hidden="true"></div>

  <main id="rockz-app">
    <section id="landing" class="landing">
      <div class="landing-inner">
        <div class="engine-status">
          <span class="status-dot"></span>
          <span>bedrock proxy system</span>
          <span class="status-divider"></span>
          <span id="landing-engine">scramjet</span>
        </div>

        <div class="brand-large">
          <span class="brand-icon">
            <i class="ri-radar-line"></i>
          </span>
          <span>rockz<span class="brand-period">.</span></span>
        </div>

        <p class="tagline">browse beyond the surface.</p>

        <form id="rockz-form" class="landing-search">
          <i class="ri-search-line search-icon"></i>
          <input
            id="rockz-address"
            type="text"
            placeholder="search or enter a url..."
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            aria-label="Search or enter a URL"
          >
          <button type="submit" aria-label="Go">
            <i class="ri-arrow-right-line"></i>
          </button>
        </form>

        <div class="search-hint">
          <span>enter</span> to browse
          <span class="hint-separator">·</span>
          <span id="landing-engine-hint">powered by scramjet</span>
        </div>

        <div class="quick-links" aria-label="Quick links">
          <button class="quick-link" type="button" data-url="https://www.google.com">
            <i class="ri-google-line"></i><span>google</span>
          </button>
          <button class="quick-link" type="button" data-url="https://www.youtube.com">
            <i class="ri-youtube-line"></i><span>youtube</span>
          </button>
          <button class="quick-link" type="button" data-url="https://discord.com">
            <i class="ri-discord-line"></i><span>discord</span>
          </button>
          <button class="quick-link" type="button" data-url="https://www.reddit.com">
            <i class="ri-reddit-line"></i><span>reddit</span>
          </button>
          <button class="quick-link" type="button" data-url="https://github.com">
            <i class="ri-github-line"></i><span>github</span>
          </button>
          <button class="quick-link" type="button" data-url="https://www.wikipedia.org">
            <i class="ri-book-open-line"></i><span>wikipedia</span>
          </button>
        </div>

        <div class="landing-footer">
          <span class="footer-mark">b/</span>
          <span>a bedrock experience</span>
          <span class="footer-version">rockz // <span id="landing-engine-version">sj</span></span>
        </div>
      </div>
    </section>

    <section id="browser" class="browser hidden" aria-label="Rockz browser">
      <header class="browser-top">
        <button class="browser-brand" id="browserHomeBtn" type="button" title="Rockz home" aria-label="Rockz home">
          <i class="ri-radar-line"></i>
        </button>

        <div class="browser-controls">
          <button class="browser-btn" id="backBtn" type="button" title="Back" aria-label="Back" disabled>
            <i class="ri-arrow-left-line"></i>
          </button>
          <button class="browser-btn" id="forwardBtn" type="button" title="Forward" aria-label="Forward" disabled>
            <i class="ri-arrow-right-line"></i>
          </button>
          <button class="browser-btn" id="homeBtn" type="button" title="Home" aria-label="Home">
            <i class="ri-home-5-line"></i>
          </button>
          <button class="browser-btn" id="reloadBtn" type="button" title="Reload" aria-label="Reload">
            <i class="ri-refresh-line"></i>
          </button>
        </div>

        <form id="rockz-browser-form" class="browser-address">
          <i class="ri-shield-check-line address-security"></i>
          <input
            id="browser-url"
            type="text"
            placeholder="search or enter a url..."
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            aria-label="Browser address"
          >
          <button type="submit" aria-label="Go">
            <i class="ri-arrow-right-line"></i>
          </button>
        </form>

        <div class="browser-actions">
          <span class="proxy-indicator" title="Active proxy engine">
            <span class="status-dot"></span>
            <span id="browser-engine">sj</span>
          </span>
          <button class="browser-btn" id="fullscreenBtn" type="button" title="Fullscreen" aria-label="Fullscreen">
            <i class="ri-fullscreen-line"></i>
          </button>
        </div>
      </header>

      <div class="browser-progress" id="browser-progress">
        <span></span>
      </div>

      <main class="browser-content">
        <div id="rockz-loading" class="frame-loading is-hidden" aria-live="polite">
          <div class="loading-orbit"><span></span></div>
          <p>connecting through rockz</p>
          <small id="loading-detail">preparing proxy route</small>
        </div>

        <div id="rockz-error" class="frame-error hidden" role="alert">
          <i class="ri-alert-line"></i>
          <h2>couldn't open this page</h2>
          <p id="rockz-error-message">the proxy route could not be opened.</p>
          <button id="rockz-retry" type="button">
            <i class="ri-refresh-line"></i> try again
          </button>
          <button id="rockz-error-home" class="secondary-button" type="button">
            return home
          </button>
        </div>

        <iframe
          id="proxy-frame"
          title="Rockz proxied webpage"
          allow="fullscreen; clipboard-read; clipboard-write"
          allowfullscreen
          referrerpolicy="no-referrer"
        ></iframe>
      </main>
    </section>
  </main>

  <div id="global-menu"></div>
</body>
</html>

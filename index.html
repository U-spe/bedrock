<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090909">
  <title>bedrock</title>
  <link rel="icon" type="image/png" href="/assets/images/favicon.png">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/menu.css">
  <link rel="stylesheet" href="/css/home.css">
</head>
<body data-bg-style="stars" data-theme="bedrock">
  <div id="bg-effects-container"><canvas id="stars-canvas"></canvas><div id="fog-overlay"></div></div>
  <div id="app">
    <div class="top"><div id="time">--:--</div><div id="date">loading...</div></div>
    <div id="global-menu"></div>
    <main class="home">
      <section class="hero">
        <div class="hero-mark" aria-hidden="true">B.</div>
        <div class="hero-text"><p class="eyebrow">YOUR SPACE. YOUR RULES.</p><h1>bedrock<span>.</span></h1><p class="subtitle">games, apps, video, and tools. all in one place.</p></div>
      </section>
      <section class="search-wrap">
        <i class="ri-search-line" aria-hidden="true"></i>
        <input id="home-search" type="search" placeholder="search bedrock..." autocomplete="off" aria-label="Search BEDROCK">
        <kbd>/</kbd>
      </section>
      <section class="section-heading"><span>QUICK ACCESS</span><span class="section-line"></span><span class="muted">01 / 06</span></section>
      <section class="quick-grid" id="quick-grid">
        <a class="quick-card" href="/games/" data-search="games play arcade"><span class="card-icon"><i class="ri-gamepad-line"></i></span><span class="card-copy"><strong>games</strong><small>play something</small></span><i class="ri-arrow-up-right-line card-arrow"></i></a>
        <a class="quick-card" href="/apps/proxied-apps/" data-search="proxied apps tiktok twitch reddit"><span class="card-icon"><i class="ri-apps-2-line"></i></span><span class="card-copy"><strong>proxied apps</strong><small>your apps, together</small></span><i class="ri-arrow-up-right-line card-arrow"></i></a>
        <a class="quick-card" href="/apps/youtube-player/" data-search="youtube video player"><span class="card-icon"><i class="ri-play-circle-line"></i></span><span class="card-copy"><strong>youtube player</strong><small>video hub</small></span><i class="ri-arrow-up-right-line card-arrow"></i></a>
        <a class="quick-card" href="/apps/ai-chat/" data-search="ai chat assistant"><span class="card-icon"><i class="ri-sparkling-2-line"></i></span><span class="card-copy"><strong>ai chat</strong><small>think it through</small></span><i class="ri-arrow-up-right-line card-arrow"></i></a>
        <a class="quick-card" href="/apps/music/" data-search="music audio"><span class="card-icon"><i class="ri-music-2-line"></i></span><span class="card-copy"><strong>music</strong><small>set the mood</small></span><i class="ri-arrow-up-right-line card-arrow"></i></a>
        <a class="quick-card" href="/proxy/" data-search="proxy browser web"><span class="card-icon"><i class="ri-global-line"></i></span><span class="card-copy"><strong>proxy</strong><small>open the web</small></span><i class="ri-arrow-up-right-line card-arrow"></i></a>
      </section>
      <p class="home-foot"><span class="status-dot"></span> BEDROCK SYSTEMS ONLINE <span class="foot-sep">/</span> <span id="year"></span></p>
    </main>
  </div>
  <script src="/js/globalmenu.js"></script>
  <script src="/js/home.js"></script>
  <script src="/js/stars.js"></script>
</body>
</html>

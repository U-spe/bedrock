<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Duck Life 2</title>
    <link rel="icon" type="image/x-icon" href="/assets/lessons/sky/ducklife2/ducklife2.png" />
    <link rel="shortcut icon" type="image/x-icon" href="/assets/lessons/sky/ducklife2/ducklife2.png" />
  </head>
  <body>
    <script src="./js/main.js"></script>
    <div id="ruffle" width="100%" height="100%"></div>
    <script src="/assets/lessons/sky/ducklife2/ruffle.js"></script>
    <script>
      window.RufflePlayer = window.RufflePlayer || {};
      window.addEventListener("load", (event) => {
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();
        const container = document.getElementById("ruffle");
        player.id = "player";
        player.style.width = "100%";
        player.style.height = "100%";
        container.appendChild(player);
        player.load("/assets/lessons/ducklife2/dl2.swf");
      });
    </script>
  </body>
</html>


<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090909">
  <title>BEDROCK — welcome</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body class="cloak-page" data-bg-style="stars">

  <div id="bg-effects-container">
    <canvas id="stars-canvas"></canvas>
    <div id="fog-overlay"></div>
  </div>

  <div id="cloak-loader" aria-label="Loading BEDROCK intro">
    <div class="loader-core">
      <div class="loader-mark">
        <span></span><span></span><span></span>
      </div>

      <div class="loader-word">BEDROCK<span>.</span></div>

      <div class="loader-track">
        <span></span>
      </div>

      <div class="loader-caption">SETTING THE FOUNDATION</div>
    </div>
  </div>

  <main class="cloak-content">
    <div class="cloak-brand">BEDROCK<span>.</span></div>
    <div class="cloak-line"></div>

    <p class="eyebrow">A DIFFERENT KIND OF FOUNDATION</p>

    <h1>
      smaller mind<br>
      for the <em>bigger craft</em>
    </h1>

    <p class="cloak-copy">
      built to keep things simple. made to make more possible.
    </p>

    <button id="welcome-button" type="button">
      aw...yeah!!
      <span aria-hidden="true">↗</span>
    </button>

    <div class="cloak-foot">
      BEDROCK SYSTEMS <span>·</span> READY WHEN YOU ARE
    </div>
  </main>

  <style>
    #cloak-loader {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      background: #090909;
      transition: opacity .55s ease, visibility .55s ease;
    }

    #cloak-loader.done {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-core {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 19px;
    }

    .loader-mark {
      height: 58px;
      display: flex;
      align-items: center;
      gap: 5px;
      transform: skew(-13deg);
    }

    .loader-mark span {
      width: 12px;
      border: 1px solid #5fae87;
      border-radius: 3px;
      background: linear-gradient(180deg, #5fae8766, #5fae8708);
      animation: loaderpulse 1.1s ease-in-out infinite;
    }

    .loader-mark span:nth-child(1) {
      height: 29px;
      animation-delay: -.2s;
    }

    .loader-mark span:nth-child(2) {
      height: 52px;
      animation-delay: -.05s;
    }

    .loader-mark span:nth-child(3) {
      height: 39px;
      animation-delay: -.35s;
    }

    .loader-word {
      font: 700 20px "Space Grotesk", sans-serif;
      letter-spacing: -.05em;
    }

    .loader-word span {
      color: #5fae87;
    }

    .loader-track {
      width: 170px;
      height: 2px;
      background: #243129;
      overflow: hidden;
      border-radius: 4px;
    }

    .loader-track span {
      display: block;
      height: 100%;
      width: 40%;
      background: #5fae87;
      box-shadow: 0 0 12px #5fae87;
      animation: loaderbar 1.25s ease-in-out infinite;
    }

    .loader-caption {
      font: 9px "JetBrains Mono", monospace;
      letter-spacing: .2em;
      color: #718177;
    }

    @keyframes loaderpulse {
      0%, 100% {
        opacity: .35;
        transform: scaleY(.82);
      }
      50% {
        opacity: 1;
        transform: scaleY(1);
      }
    }

    @keyframes loaderbar {
      0% {
        transform: translateX(-110%);
      }
      100% {
        transform: translateX(360%);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .loader-mark span,
      .loader-track span {
        animation: none;
      }
    }
  </style>

  <script src="/js/main.js"></script>
  <script>
    window.addEventListener("load", () => {
      const loader = document.getElementById("cloak-loader");

      window.setTimeout(() => {
        loader?.classList.add("done");
      }, 1500);
    });

    document.getElementById("welcome-button").addEventListener("click", () => {
      document.body.classList.add("leaving");

      window.setTimeout(() => {
        window.location.href = "/index.html";
      }, 260);
    });
  </script>
</body>
</html>
